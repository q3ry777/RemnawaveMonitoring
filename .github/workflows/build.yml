name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: v
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") { $ver = "${{ github.ref_name }}".TrimStart('v') } else { $ver = "0.0.${{ github.run_number }}" }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish RemnawaveMonitor.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=${{ steps.v.outputs.version }} -o out

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out\* -DestinationPath RemnawaveMonitor-win-x64.zip -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.0.{0}', github.run_number) }}
          files: RemnawaveMonitor-win-x64.zip
          generate_release_notes: true
          overwrite: true
