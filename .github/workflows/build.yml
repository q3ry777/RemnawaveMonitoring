name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Версия: для тега vX.Y.Z — из тега, для обычного коммита — 1.3.<номер запуска>
      - name: Version
        id: v
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") { $ver = "${{ github.ref_name }}".TrimStart('v') } else { $ver = "1.3.${{ github.run_number }}" }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish RemnawaveMonitor.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=${{ steps.v.outputs.version }} -o out

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out\* -DestinationPath RemnawaveMonitor-win-x64.zip -Force

      # Релиз создаётся явно через gh: при любой проблеме шаг упадёт и это будет видно
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.v.outputs.version }}"
          gh release create $tag RemnawaveMonitor-win-x64.zip --title $tag --generate-notes --target ${{ github.sha }} --latest
          gh release list --limit 3
